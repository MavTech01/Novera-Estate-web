<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F97316" />

    <title>Novera Estates — Lagos Homes, Land &amp; Investment Property</title>
    <meta
      name="description"
      content="Novera Estates helps you discover, inspect, buy, rent and invest in exceptional homes, land and commercial property across Lagos. Find a place that feels like yours."
    />
    <link rel="canonical" href="https://noveraestates.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Novera Estates" />
    <meta property="og:title" content="Novera Estates — Find a Place That Feels Like Yours" />
    <meta
      property="og:description"
      content="Discover exceptional homes, land, and investment opportunities in carefully selected locations."
    />
    <meta property="og:image" content="/images/hero/hero-main.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preload" href="/fonts/plus-jakarta-sans-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" as="image" href="/images/hero/hero-main.webp" fetchpriority="high" />

    <!--
      First-paint preloader.

      Shown only when the address being opened has something to fetch. A route
      built from local data — the homepage, and the sections with no page yet —
      has nothing to wait for, and putting a loading screen in front of the first
      thing a visitor came to see would only delay it. The inline script below
      makes that call, and removes this element for those addresses.

      Kept in the HTML rather than in React on purpose: a React preloader could
      not appear until the bundle had downloaded and run, which is exactly the
      blank screen this covers.

      Hidden by default, so if JavaScript is unavailable — or the bundle never
      runs — the page simply renders with no loader at all. There is no way to be
      stranded behind one.

      Inline and minimal on purpose too — it must not compete with the bundled
      stylesheet for the render-blocking budget. Its colours come from
      theme.css, injected above as --boot-* variables by the
      novera-boot-loader-tokens plugin, so there is nothing to keep in sync here.
    -->
    <!-- boot-loader-tokens -->
    <style>
      #boot-loader {
        display: none;
      }

      #boot-loader[data-boot='wait'] {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: var(--boot-surface);
        transition: opacity 320ms ease-out;
      }

      #boot-loader[data-done='true'] {
        opacity: 0;
        pointer-events: none;
      }

      #boot-loader .boot-mark {
        display: flex;
        align-items: center;
        gap: 0.625rem;
      }

      /* Tailwind's `sr-only` is not available yet — the stylesheet arrives with
         the bundle, which is the very thing being hidden here. */
      #boot-loader .boot-status {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      #boot-loader .boot-mark span {
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: var(--boot-accent);
      }

      #boot-loader .boot-track {
        position: relative;
        width: 8rem;
        height: 2px;
        overflow: hidden;
        border-radius: 9999px;
        background: var(--boot-track);
      }

      #boot-loader .boot-track::after {
        content: '';
        position: absolute;
        inset: 0;
        transform-origin: left;
        background: linear-gradient(90deg, var(--boot-accent-soft), var(--boot-accent));
        animation: boot-fill 1.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      @keyframes boot-fill {
        0% {
          transform: scaleX(0.08);
        }
        55% {
          transform: scaleX(0.72);
        }
        100% {
          transform: scaleX(0.92);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-loader .boot-track::after {
          animation: none;
          transform: scaleX(0.5);
          opacity: 0.7;
        }
      }

    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-live="polite">
      <span class="boot-status">Loading Novera Estates</span>
      <div class="boot-mark">
        <svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
          <rect width="40" height="40" rx="12"></rect>
          <path
            d="M10.5 20.5 20 11.5l9.5 9"
            fill="none"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
          <path
            d="M14.5 20v9h11V20"
            fill="none"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
        </svg>
        <span>Novera Estates</span>
      </div>
      <div class="boot-track"></div>
    </div>

    <script>
      /*
        Decide whether this address gets the preloader, before the first paint.

        `instant` holds the addresses that render from local data and have
        nothing to wait for — the homepage and the sections with no page yet.
        Its own content is the first thing people came to see, so covering it in
        a loading screen would only delay it.

        Keep this list in step with the routes whose `load` is `noLoad` in
        src/shared/lib/routeManifest.ts: those are exactly the ones with nothing
        to fetch.

        Anything else — the listing, a property page — has to fetch, and gets the
        loader.
      */
      ;(function () {
        var instant = ['/', '/projects', '/services', '/contact']
        var loader = document.getElementById('boot-loader')
        if (!loader) return

        for (var i = 0; i < instant.length; i += 1) {
          var prefix = instant[i]
          if (location.pathname === prefix || location.pathname.indexOf(prefix + '/') === 0) {
            loader.remove()
            return
          }
        }

        loader.setAttribute('data-boot', 'wait')

        // Last resort. main.tsx dismisses the loader with its own timeout; this
        // covers a bundle that never runs, so a broken deploy cannot strand a
        // visitor on a loading screen.
        setTimeout(function () {
          loader.setAttribute('data-done', 'true')
          setTimeout(function () {
            loader.remove()
          }, 400)
        }, 6000)
      })()
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
